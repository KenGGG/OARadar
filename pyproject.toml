[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oa-knowledge"
version = "0.1.0"
description = "Local-first OA knowledge archive foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.13,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "PyYAML>=6,<7",
  "playwright>=1.50,<2",
  "sqlalchemy>=2.0,<3",
  "typer>=0.12,<1",
  "cryptography>=49.0.0",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "markitdown[docx,xlsx,pptx,pdf]>=0.1",
  "pymupdf>=1.24",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<9", "pytest-cov>=5,<7"]

[project.scripts]
oa = "oa_knowledge.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/oa_knowledge"]

[tool.pytest.ini_options]
addopts = "-q --cov=oa_knowledge --cov-report=term-missing"
testpaths = ["tests"]
