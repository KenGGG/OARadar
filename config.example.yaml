app:
  timezone: Asia/Shanghai
  data_root: ./data
  privacy_mode: local_only

browser:
  # Copy this file to config.yaml, then replace the reserved example values
  # below with paths from your own OA installation. config.yaml is ignored.
  base_url: https://oa.example.invalid
  context_path: /oa
  login_path: /oa/login
  executable_path: /usr/bin/google-chrome
  user_data_dir: runtime/browser-profile
  headless: true
  ignore_https_errors: false
  done_list_path: /oa/done
  navigation_timeout_seconds: 30

collector:
  overlap_days: 7
  daily_stop_pages: 5
  max_attachment_depth: 10
  list_page_delay_seconds: 0.2
  item_delay_seconds: 0.2
  download_timeout_seconds: 300
  attachment_total_timeout_seconds: 1500
storage:
  sqlite_path: state/oa.db
  archive_dir: archive/raw/oa
  journal_mode: WAL
  compute_sha256: true

markdown_export:
  enabled: true
  workspace_root: workspace
  # The generated Markdown is atomically published here and picked up by the
  # external llm_wiki project as its OA source directory (plan-0807-1 §9.4 交接).
  source_markdown_dir: raw/sources/oa
  preserve_source_tree: true
  filename_mode: append_md
  write_frontmatter: true
  write_assets: true
  atomic_publish: true
  keep_last_success_on_failure: true
  generate_failure_stub: true

conversion:
  incremental: true
  workers: 1
  force_rebuild: false

# Pending (待办) notification data retention. Pending items are short-lived
# notification records, not permanent knowledge assets. After Feishu confirms a
# successful delivery the business payload is erased and only the minimal
# de-duplication ledger is retained. See docs/plan-0807-1.md §6.
pending_cleanup:
  auto_cleanup_after_success: true
  cleanup_delay_hours: 0
  failed_retention_days: 30
  keep_summary_body: false
  keep_page_snapshot: false
  keep_temp_attachments: false
  allow_force_cleanup: true  # 仅允许人工清理已确认 sent 的数据，不能绕过投递确认

# Deterministic local aliases for external institutions. These only generate
# reviewable suggestions; no suggestion is automatically confirmed.
rebuild:
  external_issuer_aliases: {}
  # A protected sibling of the live app.data_root; never point this at data/.
  target_root: ../data_rebuilt
  item_title_max_chars: 96
  # `oa rebuild build --execute` requires a private mode-0600 aggregate
  # attestation file plus this environment variable. Store the HMAC key itself
  # only in the environment (32+ bytes); never write it into this YAML.
  acceptance_evidence_key_env: OA_REBUILD_ACCEPTANCE_EVIDENCE_HMAC_KEY

archive:
  max_recursive_depth: 2
  max_members: 10000
  max_member_bytes: 536870912
  max_total_bytes: 2147483648
  max_ratio: 200

web:
  host: 127.0.0.1
  port: 2567

# Feishu (Lark) custom-bot notifications for Pending summaries. The webhook URL
# and signing secret MUST come from environment variables (FEISHU_OA_WEBHOOK /
# FEISHU_OA_SECRET) — never store them inline here. The repository's secret
# guard (FORBIDDEN_KEYS) rejects plaintext credentials in YAML.
feishu:
  enabled: false
  webhook_env: FEISHU_OA_WEBHOOK
  secret_env: FEISHU_OA_SECRET
  message_type: interactive
  max_items_per_section: 10
  redact_confidential: true
  retry_attempts: 3

mineru:
  enabled: false
  api_url: http://127.0.0.1:58000
  connect_timeout_seconds: 5
  read_timeout_seconds: 1800
  health_timeout_seconds: 3
  workers: 1
  model_source: local
  output_content_list: true

# Local Ollama text model. OA-derived text must never use a remote endpoint.
llm:
  enabled: false
  active_provider: ollama
  ollama_base_url: http://127.0.0.1:11434/v1
  ollama_model: qwen3.5:9b
  provider_name: ollama
  base_url: http://127.0.0.1:11434/v1
  api_key_env: OLLAMA_API_KEY
  model: qwen3.5:9b
  text_model: qwen3.5:9b
  vision_model: qwen3-vl:8b
  timeout_seconds: 180
  max_tokens: 4096
  temperature: 0.1
  max_retries: 2
  provider_mode: local_only
  supports_json_schema: false
  supports_vision: false
  uses_local_gpu: true
  allow_confidential: false
  allow_restricted: false
  require_redaction: true
  max_concurrency: 1
  context_window_fallback: 8192
  context_window_cap: 131072
  context_safety_margin: 1024
