services:
  mineru-api:
    build: .
    image: oaradar-mineru:4.0.11
    container_name: oaradar-mineru-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:58000:8000"
    volumes:
      - ../data/mineru:/var/lib/mineru
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
